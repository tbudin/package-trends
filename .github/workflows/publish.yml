name: Publish

# Releasing, start to finish:
#
#   pnpm changeset            describe the change
#   pnpm run bump             apply the changesets: bumps package.json, writes CHANGELOG.md
#                             (not `pnpm version` — that is pnpm's own command)
#   git commit -am "chore: release vX.Y.Z" && git push
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag is what starts this workflow. It checks the tag against package.json,
# runs the whole suite, publishes to npm with trusted publishing (no token: npm
# trusts this workflow by name, and the registry attaches the provenance
# attestation itself), copies it to GitHub Packages, and writes the GitHub
# release from CHANGELOG.md. The tag is the only manual step.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      id-token: write   # npm trusted publishing
      packages: write   # the copy on GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # registry-url is required, not optional. It writes the .npmrc entry for
      # registry.npmjs.org that the OIDC exchange fills in; without it npm has
      # no auth slot for the registry and gives up with ENEEDAUTH before ever
      # asking GitHub for a token. setup-node also sets NODE_AUTH_TOKEN to its
      # own placeholder here, which `npm publish` would send as a real token
      # and be answered with a 404 — one more reason the release stages rather
      # than publishes direct. This is papertooth's arrangement exactly.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@11.21.0 && npm --version
      - run: pnpm install --frozen-lockfile

      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint:package
      - run: pnpm lint:types

      # The site is deliberately not checked here, though it could be now that
      # the lockfile pins package-site: the published tarball carries dist,
      # types, src, README and LICENSE, never docs/. A site that lags its
      # source is a site problem; it must not hold back a package release.
      # CI checks it on every push instead — see the `site` job in ci.yml.

      # `npm stage publish`, not `npm publish`: a trusted publisher may stage a
      # release without any further opt-in, while publishing straight to latest
      # is a separate permission on npmjs.com. Staging is what papertooth does,
      # and the release goes public when a maintainer approves it under Staged
      # Packages. A refused direct publish reports ENEEDAUTH, which reads like a
      # missing login rather than a permission the token was never granted.
      - name: Stage on npm (approve it on npmjs.com, Staged Packages)
        run: npm stage publish

      - name: Release notes from CHANGELOG.md
        run: |
          node -e '
            const v = process.env.GITHUB_REF_NAME.slice(1), s = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const m = s.match(new RegExp("^## " + v.replace(/\./g, "\\.") + "(?: - [0-9-]+)?\\n([\\s\\S]*?)(?=^## |$(?![\\s\\S]))", "m"));
            if (!m) { console.error("No section for " + v + " in CHANGELOG.md"); process.exit(1); }
            require("fs").writeFileSync("notes.md", m[1].trim() + "\n\nnpm: `npm i package-trends@" + v + "` · [full changelog](https://github.com/" + process.env.GITHUB_REPOSITORY + "/blob/main/CHANGELOG.md)\n");
          '
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      # GitHub only lists packages from its own registry on the repository page, under a scoped name
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@tbudin'
      - name: Copy to GitHub Packages as @tbudin/package-trends
        run: |
          npm pkg set name=@tbudin/package-trends
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
