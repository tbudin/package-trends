name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the range package.json claims in engines
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  package:
    # publint checks the exports map and the files list; attw checks the types
    # resolve for every kind of consumer. Four entry points and emitted
    # modules is exactly the shape that breaks here and nowhere else.
    #
    # attw runs against the esm-only profile: the package is "type": "module"
    # with no CommonJS build, so a require() of it failing is the design, not a
    # defect. node10 is ignored for the same reason — handing it declarations
    # for JavaScript it cannot load would be worse than failing clearly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:package
      - run: pnpm lint:types

  site:
    # The site is generated by package-site, which the lockfile pins, so this
    # can run here rather than only on the machine that has the template as a
    # sibling folder. Its own job on purpose: docs/ is never published in the
    # tarball, so a site failure must not read as a package failure.
    #
    # build:docs first, then the diff: docs/ is committed output, and the way
    # it goes wrong is someone editing site/pages.js and not rebuilding. A
    # check that read the committed copy would pass on exactly that mistake.
    runs-on: ubuntu-latest
    steps:
      # Full history: the changelog page and the feed date each release from
      # `git log -S` over CHANGELOG.md, and a shallow clone has none of it, so
      # the dates would fall back to the checkout's mtime and the diff below
      # would fail on every run for a reason that is not staleness.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:docs
      - name: docs/ is in step with the source
        run: git diff --exit-code docs/
      - run: pnpm check:docs
