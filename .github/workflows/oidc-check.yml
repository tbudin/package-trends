# Throwaway diagnostic for the trusted-publishing failure. Run it by hand, read
# the answer, delete the file. It prints no token, only the claims npm matches
# a trusted publisher against.
name: OIDC check

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Is an OIDC token obtainable at all
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "NO: ACTIONS_ID_TOKEN_REQUEST_URL is unset — the job has no OIDC at all."
            exit 1
          fi
          echo "YES: the request URL is present."
      - name: The claims npm would see
        run: |
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')
          node -e '
            const [, payload] = process.argv[1].split(".");
            const c = JSON.parse(Buffer.from(payload, "base64url").toString());
            for (const k of ["iss", "aud", "repository", "repository_owner", "workflow_ref", "job_workflow_ref", "ref", "environment"]) {
              console.log(k.padEnd(18), c[k] ?? "(absent)");
            }
          ' "$jwt"
