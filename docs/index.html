<style>

<script type="module">
import {
  fetchDownloads, fetchMany, computeTrend, analyse, compare,
  sparklineSvg, toBands, formatCount, formatChange, formatExact,
  formatWeekday, describeTrend,
} from "./assets/package-trends.js";

const VERSION = "0.1.0";
const L = "en-US";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- global settings: which package, over what period ---------- */

const G = { pkg: "react", period: "last-month" };
const cache = new Map();
const load = () => {
  const key = `${G.pkg}|${G.period}`;
  if (!cache.has(key)) cache.set(key, fetchDownloads(G.pkg, { period: G.period }));
  return cache.get(key);
};

const RIVALS = ["react", "vue", "svelte", "preact"];
let rivalsPromise = null;
const loadRivals = () => (rivalsPromise ??= fetchMany(RIVALS, (n) => fetchDownloads(n, { period: "last-month" })));

/* A fixed series for the pages that illustrate layout rather than data. */
const SAMPLE = [41, 44, 43, 47, 52, 49, 55, 58, 56, 61, 64, 62, 68, 71, 74];

/* ---------- the pages ---------- */

/* A fluid chart keeps the viewBox it is given and stretches to the container,
   so the width here is really an aspect ratio against the height: leave it at
   the default 300 and a wide box scales the stroke up with it. */
const chart = (values, options) => sparklineSvg(values, { width: 760, fluid: true, ...options });

const figs = (t) => `<p class="figs"><b>${formatCount(t.total, L)}</b> downloads ·
  <span class="${t.changeRatio >= 0 ? "up" : "down"}">${formatChange(t.changeRatio, L)}</span> ·
  ${t.start} to ${t.end}${t.gapDays.length ? ` · ${t.gapDays.length} day${t.gapDays.length === 1 ? "" : "s"} repaired` : ""}</p>`;

const PAGES = [
  {
    id: "intro", group: "Start", title: "Download trends, small enough for a footer",
    keywords: "install start hello intro",
    lead: `A package's npm downloads as a sparkline, a line of text or a KPI block. No dependencies, no stylesheet, no chart library — <code>9.1 kB</code> for the core and <code>10.5 kB</code> with the React components, gzipped as a bundler ships them.`,
    render: (s, d) => {
      const t = computeTrend(d);
      return `<div class="col-stack">
        <div style="width:100%">${chart(t.values, { height: 90, dot: true, strokeWidth: 2, fill: "color-mix(in oklab, currentColor 10%, transparent)", label: describeTrend(t, L) })}</div>
        ${figs(t)}</div>`;
    },
    code: () => `npm install package-trends`,
    after: () => `<h2>Three shapes, one component</h2>
      <div class="grid-links">
        <a href="#sparkline"><b>Sparkline</b><span>Shape only, for a nav or a table cell.</span></a>
        <a href="#text"><b>Text</b><span>One line, inside a sentence.</span></a>
        <a href="#kpi"><b>KPI</b><span>The number leads, the chart confirms.</span></a>
      </div>
      <h2>The npm API needs no key</h2>
      <p>It sends <code>access-control-allow-origin: *</code>, so this works straight from a browser
      with no proxy of your own. Every chart on this site was fetched by your browser as you loaded
      it — change the package in the header and watch them all follow.</p>`,
  },
  {
    id: "sparkline", group: "Variants", title: "Sparkline", keywords: "chart line default shape",
    lead: `The default. Shape only — no axes, no labels, nothing but the line — for a nav, a list row or a table cell.`,
    state: { w: 210, h: 44, sw: 1.5, dot: true, fill: false },
    controls: [
      { k: "w", type: "range", label: "Width", min: 60, max: 420, step: 10, unit: "px" },
      { k: "h", type: "range", label: "Height", min: 14, max: 120, step: 2, unit: "px" },
      { k: "sw", type: "range", label: "Stroke", min: 0.5, max: 4, step: 0.25 },
      { k: "dot", type: "toggle", label: "Dot on the last point" },
      { k: "fill", type: "toggle", label: "Fill the area" },
    ],
    render: (s, d) => {
      const t = computeTrend(d);
      return sparklineSvg(t.values, {
        width: s.w, height: s.h, dot: s.dot, strokeWidth: s.sw,
        fill: s.fill ? "color-mix(in oklab, currentColor 12%, transparent)" : undefined,
        label: describeTrend(t, L),
      });
    },
    code: (s) => `<PackageTrend\n  package="${G.pkg}"\n  width={${s.w}} height={${s.h}}${s.sw !== 1.5 ? `\n  strokeWidth={${s.sw}}` : ""}${s.dot ? "\n  dot" : ""}${s.fill ? `\n  fill="color-mix(in oklab, currentColor 12%, transparent)"` : ""}\n/>`,
  },
  {

    code: () => `import { … } from "package-trends";          // 9.1 kB gzipped\nimport { … } from "package-trends/react";    // 10.5 kB\nimport { … } from "package-trends/compare";  // 12.4 kB`,
    after: () => `<h2>Props</h2><div class="ref-wrap"><table class="ref">
      <tr><th>Prop</th><th>Type</th><th>What it does</th></tr>${[
        ["package", "string", "The package name, scoped names included."],
        ["data", "DownloadRange", "A range already fetched. When set, nothing is requested."],
        ["period", "Period | between()", '"last-week", "last-month", "last-year", or an explicit pair.'],
        ["variant", '"sparkline" | "text" | "kpi"', "Default sparkline."],
        ["chart", '"line" | "column" | "band"', "The chart form."],
        ["curve", '"linear" | "smooth" | "step" | "step-before"', "How the line joins its points."],
        ["domain", '[number, number] | "auto" | "zero"', "The y-range the values are laid out across."],
        ["aggregate", '"week" | "month"', "Buckets whole weeks or months back from the latest day."],
        ["smooth", "number", "Moving-average window for the drawn line. Default 7."],
        ["gaps", '"fill" | "zero"', "What to do with the days npm has no data for. Default fill."],
        ["width / height", "number | string", "Pixels, or a CSS length that scales with the text."],
        ["fluid", "boolean", "Fill the container's width rather than sit at a natural size."],
        ["mark / markColor", "MarkKind[] / record", "Points to call out: last, peak, trough."],
        ["axis / axisColor", "boolean / string", "A rule at zero where zero is inside the domain."],
        ["fill / fillPattern", "string / FillPattern", "Area or bar fill, flat or patterned."],
        ["stroke / strokeWidth / strokeDasharray", "string / number / string", "The line itself."],
        ["colors", "{ up, down }", "The rise and fall figures. Unset, they inherit."],
        ["styles", "record", "Inline styles per part: weight, display, spacing."],
        ["numberFormat / percentFormat", "Intl.NumberFormatOptions", "Merged over the defaults."],
        ["locale", "string", "Passed to Intl."],
        ["label", "string | (trend) => string", "The accessible name for the chart."],
        ["interactive / onActivePoint", "boolean / fn", "Pointer and keyboard inspection."],
        ["fallback / renderError", "ReactNode / fn", "While loading, and when it fails."],
        ["svgProps / pathProps", "record", "Anything else the elements should carry."],
        ["children", "(state) => ReactNode", "Replaces the built-in markup entirely."],
      ].map(([a, b, c]) => `<tr><td><code>${esc(a)}</code></td><td><code>${esc(b)}</code></td><td>${esc(c)}</td></tr>`).join("")}
      </table></div>
      <h2>Core exports</h2><div class="ref-wrap"><table class="ref">
      <tr><th>Export</th><th>What it does</th></tr>${[
        ["fetchDownloads(name, options)", "One package's range from the npm API."],
        ["fetchMany(names, fetchOne)", "Several at once, asking for each distinct name only once."],
        ["computeTrend(range, options)", "Totals, peak, trough and change from the raw series, plus the shaped values to draw."],
        ["analyse(range, options)", "Growth, fit and r², weekday profile, volatility, spikes, streak."],
        ["compare(ranges, options)", "Several ranges on one scale, absolute or indexed."],
        ["sparklineSvg(values, options)", "A standalone SVG string, for anywhere outside React."],
        ["toWeekly / toMonthly / toBands", "Bucketing."],
        ["fillGaps / applyGaps", "The zero repair, on its own."],
        ["formatCount / formatChange / formatExact / formatWeekday", "Intl-backed formatting."],
        ["describeTrend(trend, locale)", "The sentence a screen reader gets."],
        ["between(from, to)", "An explicit date range."],
      ].map(([a, b]) => `<tr><td><code>${esc(a)}</code></td><td>${esc(b)}</td></tr>`).join("")}
      </table></div>`,
  },
];

/* ---------- navigation ---------- */

const GROUPS = [...new Set(PAGES.map((p) => p.group))];
const list = document.getElementById("nav-list");
list.innerHTML = GROUPS.map((g) =>
  `<div class="nav-group"><h4>${esc(g)}</h4>` +
  PAGES.filter((p) => p.group === g).map((p) =>
    `<a href="#${p.id}" data-id="${p.id}" data-words="${esc((p.title + " " + p.group + " " + (p.keywords || "")).toLowerCase())}">${esc(p.title)}</a>`).join("") +
  `</div>`).join("");

const find = document.getElementById("find");
const nothing = document.getElementById("nothing");
find.addEventListener("input", () => {
  const q = find.value.trim().toLowerCase();
  let hits = 0;
  for (const a of list.querySelectorAll("a")) {
    const on = !q || a.dataset.words.includes(q);
    a.hidden = !on;
    if (on) hits++;
  }
  for (const g of list.querySelectorAll(".nav-group")) {
    g.hidden = ![...g.querySelectorAll("a")].some((a) => !a.hidden);
  }
  nothing.hidden = hits > 0;
});
addEventListener("keydown", (e) => {
  if (e.key === "/" && e.target === document.body) { e.preventDefault(); find.focus(); }
});

const side = document.getElementById("side");
const scrim = document.getElementById("scrim");
const menuBtn = document.getElementById("menu-btn");
const setMenu = (open) => {
  side.classList.toggle("open", open);
  scrim.hidden = !open;
  menuBtn.setAttribute("aria-expanded", String(open));
};
menuBtn.addEventListener("click", () => setMenu(!side.classList.contains("open")));
scrim.addEventListener("click", () => setMenu(false));
document.getElementById("side-close").addEventListener("click", () => setMenu(false));

/* On a phone the settings move into the drawer, where there is room for them. */
const settings = document.getElementById("settings");
const sideSettings = document.getElementById("side-settings");
const placeSettings = () => {
  const narrow = matchMedia("(max-width: 860px)").matches;
  const home = narrow ? sideSettings : document.querySelector(".top");
  if (settings.parentElement !== home) home.appendChild(settings);
};
placeSettings();
addEventListener("resize", placeSettings);

document.getElementById("version").textContent = `v${VERSION}`;

/* ---------- controls ---------- */

function controlHtml(c, v) {
  const id = `c-${c.k}`;
  if (c.type === "select") {
    const opts = c.options.map((o) => (Array.isArray(o) ? o : [o, o]));
    return `<div class="ctl"><label for="${id}"><span>${esc(c.label)}</span></label><select id="${id}" data-k="${c.k}">${
      opts.map(([val, lab]) => `<option value="${esc(val)}"${String(val) === String(v) ? " selected" : ""}>${esc(lab)}</option>`).join("")}</select></div>`;
  }
  if (c.type === "range") {
    return `<div class="ctl"><label for="${id}"><span>${esc(c.label)}<output id="${id}-o">${v}${esc(c.unit || "")}</output></span></label>
      <input type="range" id="${id}" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}"></div>`;
  }
  return `<label class="ctl check" for="${id}"><input type="checkbox" id="${id}" data-k="${c.k}"${v ? " checked" : ""}><span>${esc(c.label)}</span></label>`;
}

/* ---------- rendering a page ---------- */

const page = document.getElementById("page");
const here = document.getElementById("here");
const state = new Map();
let current = null;

/* A code box takes plain text. It has to: the samples are JSX, and an
   unescaped <PackageTrend> is parsed as an unknown element and renders as
   nothing at all. Comments are picked out after escaping, never before. */
const renderCode = (text) => esc(text)
  .replace(/(\/\*[\s\S]*?\*\/|\/\/[^\n]*)/g, '<span class="c">$1</span>');
const codeBox = (text) => `<div class="code"><pre>${renderCode(text)}</pre><button class="copy" type="button">Copy</button></div>`;

function paint(p, data, extra) {
  const s = state.get(p.id);
  const controls = p.controls || [];
  const stageInner = data
    ? p.render(s, data, extra)
    : `<p class="loading">Fetching ${esc(G.pkg)} from npm…</p>`;

  const play = p.hidePlay ? "" : `
    ${controls.length ? `<div class="play-tabs" role="tablist">
      <button type="button" role="tab" data-view="preview" aria-selected="true">Preview</button>
      <button type="button" role="tab" data-view="settings" aria-selected="false">Settings</button>
    </div>` : ""}
    <div class="play${controls.length ? "" : " solo"}" data-view="preview">
      <div class="stage" id="stage">${stageInner}</div>
      ${controls.length ? `<div class="ctls"><h3>Settings</h3>${controls.map((c) => controlHtml(c, s[c.k])).join("")}</div>` : ""}
    </div>`;

  const i = PAGES.indexOf(p);
  const prev = PAGES[i - 1], next = PAGES[i + 1];

  page.innerHTML = `
    <p class="crumb">${esc(p.group)}</p>
    <h1 class="title">${esc(p.title)}</h1>
    <p class="lead">${p.lead}</p>
    ${play}
    ${p.code ? `<p class="code-label">The code for what is on screen</p>${codeBox(p.code(s))}` : ""}
    ${p.after ? p.after(s) : ""}
    <nav class="pager" aria-label="Pages">
      ${prev ? `<a href="#${prev.id}"><small>Previous</small>${esc(prev.title)}</a>` : "<span></span>"}
      ${next ? `<a href="#${next.id}" style="text-align:right"><small>Next</small>${esc(next.title)}</a>` : ""}
    </nav>
    <footer class="colophon">
      <span>MIT · © Plain Matter Pte Ltd</span>
      <span>Built by <b>Thomas Budin</b></span>
      <span class="spacer"><a href="https://github.com/tbudin/package-trends">GitHub</a></span>
      <span><a href="https://www.npmjs.com/package/package-trends">npm</a></span>
    </footer>`;

  page.querySelectorAll("[data-k]").forEach((el) => {
    const c = controls.find((x) => x.k === el.dataset.k);
    el.addEventListener(el.type === "range" ? "input" : "change", () => {
      s[c.k] = el.type === "checkbox" ? el.checked : el.type === "range" ? Number(el.value) : el.value;
      if (el.type === "range") page.querySelector(`#c-${c.k}-o`).textContent = `${s[c.k]}${c.unit || ""}`;
      redraw(p, extra);
    });
  });

  page.querySelectorAll(".play-tabs button").forEach((b) => b.addEventListener("click", () => {
    page.querySelector(".play").dataset.view = b.dataset.view;
    page.querySelectorAll(".play-tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  }));

  page.querySelectorAll(".code .copy").forEach((b) => b.addEventListener("click", async () => {
    const pre = b.previousElementSibling;
    try { await navigator.clipboard.writeText(pre.textContent); b.textContent = "Copied"; }
    catch { getSelection().selectAllChildren(pre); b.textContent = "Select it"; }
    setTimeout(() => (b.textContent = "Copy"), 1400);
  }));
}

/* Redraws the stage and the code box without rebuilding the whole page. */
function redraw(p, extra) {
  const s = state.get(p.id);
  const data = ready.get(p.id);
  const stage = page.querySelector("#stage");
  if (stage && data) stage.innerHTML = p.render(s, data, extra);
  const pre = page.querySelector(".code pre");
  if (pre && p.code) pre.innerHTML = renderCode(p.code(s));
}

const ready = new Map();

async function show(id) {
  const p = PAGES.find((x) => x.id === id) || PAGES[0];
  current = p;
  if (!state.has(p.id)) state.set(p.id, { ...(p.state || {}) });

  here.textContent = p.title;
  for (const a of list.querySelectorAll("a")) {
    if (a.dataset.id === p.id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  setMenu(false);
  scrollTo(0, 0);
  paint(p, null, null);

  try {
    const data = await load();
    if (current !== p) return;
    ready.set(p.id, data);
    const extra = p.needs === "rivals" ? await loadRivals() : null;
    if (current !== p) return;
    paint(p, data, extra);
  } catch (error) {
    const stage = page.querySelector("#stage");
    if (stage) stage.innerHTML = `<p class="err">Could not reach the npm downloads API: ${esc(error.message)}</p>`;
  }
}

/* Changing the package or the period redraws whatever is open. */
document.getElementById("g-pkg").addEventListener("change", (e) => {
  const v = e.target.value.trim();
  if (v) { G.pkg = v; ready.clear(); show(current.id); }
});
document.getElementById("g-period").addEventListener("change", (e) => {
  G.period = e.target.value; ready.clear(); show(current.id);
});

/* ---------- routing ---------- */
const route = () => show(location.hash.slice(1) || "intro");
addEventListener("hashchange", route);
route();
</script>

</body>
</html>
